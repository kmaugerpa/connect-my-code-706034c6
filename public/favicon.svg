<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="560" height="330" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1b2a44">KM monogram — three styles</text>
  <text x="30" y="62" font-size="13" fill="#7a7a7a">Large = the design · Small = how it looks in an actual browser tab</text>

  <!-- column headers -->
  <text x="120" y="92" font-size="11" fill="#9a9a9a" text-anchor="middle">DESIGN</text>
  <text x="250" y="92" font-size="11" fill="#9a9a9a" text-anchor="middle">TAB SIZE</text>

  <!-- Option A: Navy + cream serif -->
  <g transform="translate(70,110)">
    <rect width="64" height="64" rx="14" fill="#1b2a44"/>
    <text x="32" y="35" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#f0e8d8" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">KM</text>
  </g>
  <g transform="translate(234,134)">
    <rect width="18" height="18" rx="4" fill="#1b2a44"/>
    <text x="9" y="10" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#f0e8d8" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.5">KM</text>
  </g>
  <text x="300" y="138" font-size="15" font-weight="600" fill="#1b2a44">A · Navy + cream serif</text>
  <text x="300" y="156" font-size="12" fill="#7a7a7a">Elegant, matches your serif site</text>

  <!-- Option B: Blue + white sans -->
  <g transform="translate(70,195)">
    <rect width="64" height="64" rx="14" fill="#2f6fed"/>
    <text x="32" y="34" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="-1.5">KM</text>
  </g>
  <g transform="translate(234,219)">
    <rect width="18" height="18" rx="4" fill="#2f6fed"/>
    <text x="9" y="10" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.5">KM</text>
  </g>
  <text x="300" y="223" font-size="15" font-weight="600" fill="#1b2a44">B · Blue + white sans</text>
  <text x="300" y="241" font-size="12" fill="#7a7a7a">Modern, clean, high contrast</text>

  <!-- Option C: Cream + navy serif -->
  <g transform="translate(70,280)">
    <rect width="64" height="64" rx="14" fill="#f0e8d8" stroke="#e2d9c5" stroke-width="1"/>
    <text x="32" y="35" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#1b2a44" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">KM</text>
  </g>
  <g transform="translate(234,304)">
    <rect width="18" height="18" rx="4" fill="#f0e8d8" stroke="#e2d9c5" stroke-width="0.5"/>
    <text x="9" y="10" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#1b2a44" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.5">KM</text>
  </g>
  <text x="300" y="308" font-size="15" font-weight="600" fill="#1b2a44">C · Cream + navy serif</text>
  <text x="300" y="326" font-size="12" fill="#7a7a7a">Light, understated, warm</text>
</svg>
